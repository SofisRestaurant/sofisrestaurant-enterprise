<!doctype html>
<html lang="en">
  <head>
    <!-- ── Core Meta ──────────────────────────────────────────── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── Title & SEO ───────────────────────────────────────── -->
    <title>Sofi's Restaurant | Crafted With Intention · Surprise Arizona</title>
    <meta
      name="description"
      content="Sofi's Restaurant — seasonal ingredients, honest technique, and unforgettable evenings in Surprise Arizona. Reserve your table or order online."
    />
    <meta name="author" content="Sofi's Restaurant" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sofisrestaurant.com" />

    <!-- ── Favicon ────────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1915" />

    <!-- ── Open Graph ────────────────────────────────────────── -->
    <meta property="og:type"         content="restaurant.restaurant" />
    <meta property="og:site_name"    content="Sofi's Restaurant" />
    <meta property="og:title"        content="Sofi's Restaurant — Crafted With Intention" />
    <meta property="og:description"  content="Seasonal ingredients, honest technique, unforgettable evenings. Reserve your table today." />
    <meta property="og:image"        content="/images/og-cover.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"          content="https://sofisrestaurant.com" />
    <meta property="og:locale"       content="en_US" />

    <!-- ── Twitter / X ────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Sofi's Restaurant — Crafted With Intention" />
    <meta name="twitter:description" content="Seasonal ingredients, honest technique, unforgettable evenings." />
    <meta name="twitter:image"       content="/images/og-cover.jpg" />

    <!-- ── Performance — font preconnects (must precede Google Fonts import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Accessibility ─────────────────────────────────────── -->
    <meta name="color-scheme" content="light" />

    <!-- ── Structured Data ───────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Sofi's Restaurant",
        "url": "https://sofisrestaurant.com",
        "description": "Seasonal ingredients, honest technique, unforgettable evenings in Surprise Arizona.",
        "servesCuisine": ["Contemporary", "Seasonal American"],
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Surprise Arizona",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
            "opens": "17:30",
            "closes": "22:00"
          }
        ],
        "hasMenu": "https://sofisrestaurant.com/menu",
        "acceptsReservations": "True"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Georgia,serif;color:#1c1c1c;background:#faf6ef;padding:2rem;text-align:center;">
        <div>
          <h1 style="font-size:2rem;margin-bottom:1rem;">Sofi's Restaurant</h1>
          <p style="color:#8a7a6a;">Please enable JavaScript to experience our full website.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
